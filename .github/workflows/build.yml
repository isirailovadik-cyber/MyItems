name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build plugin
        run: gradle build --no-daemon

      - name: Zip resource pack
        run: cd resourcepack && zip -r ../MyItems-resourcepack.zip .

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MyItems-plugin
          path: build/libs/*.jar

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: MyItems-resourcepack
          path: MyItems-resourcepack.zip
